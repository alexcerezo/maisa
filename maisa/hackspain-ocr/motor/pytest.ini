[pytest]
# `pythonpath = src` (nativo desde pytest 7) evita tener que exportar
# PYTHONPATH=src a mano para importar el paquete `maisa`.
pythonpath = src
testpaths = tests
addopts = -ra --strict-markers -m "not lento"
markers =
    lento: necesita OCR o recorrer el corpus entero; excluido por defecto
