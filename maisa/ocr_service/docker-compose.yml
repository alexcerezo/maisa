# Servicio de OCR (FastAPI + RapidOCR).
#
# Redes:
#   - ocr_service_default: red propia del servicio (nombre fijado, no depende
#     del directorio ni del project name).
#   - albertitos_net: red COMPARTIDA con MongoDB y con el middleware/API.
#     Es externa; creala una sola vez antes del primer arranque:
#       docker network create albertitos_net
#     (o `docker compose up -d` en el directorio padre, que la declara igual).
#
# El contenedor se llama `ocr-api`, asi que dentro de albertitos_net se le
# alcanza por DNS como `http://ocr-api:8866` (o `http://ocr:8866`).
services:
  ocr:
    build: .
    image: ocr-rapidocr-arm64:latest
    container_name: ocr-api
    restart: unless-stopped
    ports:
      # Puerto 8866 en el host (el historico de Paddle Serving, evita el 8080)
      - "8866:8866"
    volumes:
      # Cache de modelos ONNX. RapidOCR los guarda dentro del paquete, no en $HOME.
      # La primera vez Docker copia aqui el contenido pre-descargado en el build,
      # asi que la imagen arranca sin red y sin espera.
      - ocr_models:/usr/local/lib/python3.12/site-packages/rapidocr/models
      # Archivos de prueba accesibles desde el host
      - ./test_files:/home/ocr/test_files:ro
      # Temporales de subida (OCR_TMP_DIR). En un volumen dedicado para no
      # escribir en la capa de escritura del contenedor, que penaliza los
      # ficheros grandes. Si cambias OCR_TMP_DIR en .env, cambia esta ruta.
      - ocr_tmp:/tmp/ocr-work
    env_file:
      - .env
    environment:
      # 2 nucleos fisicos: 1 hilo por nucleo evita sobre-suscripcion
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    # Margen: la inferencia con rec=server ronda 1-1.5 GB en picos
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8866/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      # La red propia del OCR (se conserva tal cual: es la que da el puerto y
      # el aislamiento del servicio) mas la red compartida del sistema.
      - default
      - albertitos_net

volumes:
  ocr_models:
  ocr_tmp:

networks:
  # Red propia del servicio OCR. Se fija el nombre para que no dependa del
  # directorio ni del project name de Compose.
  default:
    name: ocr_service_default
  # Red compartida con MongoDB (y con el middleware/API que vendra despues).
  # Es EXTERNA: la crea el operador una sola vez con
  #   docker network create albertitos_net
  # antes de "docker compose up". Al ser externa, un "down" de este proyecto
  # no se la lleva por delante.
  albertitos_net:
    external: true
    name: albertitos_net
