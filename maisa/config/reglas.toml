# LEGADO DEL MOTOR RUST. NO PASAR ESTE FICHERO A `--config`.
#
# El motor vivo es `motor/` (Python) y su norma es `motor/config/reglas.toml`.
# Este fichero solo lo lee `src/rules.rs`, el motor Rust que se conserva como
# referencia historica, y usa un esquema INCOMPATIBLE con el del motor vivo
# (claves planas aqui, `[umbrales]`/`[precedencia]`/`[reglas.*]`/`[hechos_duros]`
# alli).
#
# Hasta ahora, `maisa.procesa --config config/reglas.toml` desde la raiz de
# `maisa/` cargaba este fichero SIN ERROR y producia `{'PAGAR': 500}`: sin
# `[reglas]` toda factura caia al resultado por defecto. `norma.Politica.carga`
# ya rechaza ese esquema, asi que esto es defensa en profundidad, no la unica.
#
# Reglas parametrizables del motor de decision. Ver spec_y_plan.md 3.5.
# Este archivo es el punto de inyeccion de la regla nueva del sabado 18:00.
# (Lo era del motor Rust; el punto de inyeccion vivo es motor/config/reglas.toml.)

# Version logica del juego de reglas. Va a `Decision::huellas.reglas_version`,
# asi que hay que subirla en el mismo commit que cambia una regla: es lo que
# permite saber con que reglas se pago y que decisiones han quedado obsoletas.
#
# version 2 = tolerancia 0.02 -> 0.01. Se sube en el mismo commit que el cambio
# de regla: las decisiones tomadas con version 1 usaban 0.02 EUR de margen y no
# son comparables con las de version 2.
version = 2

# Tolerancia de un centimo: el valor de la hoja `Norma_Pagos_v3` del Excel de
# control (NO 0.02, que era la suposicion inicial del plan). Absorbe el ruido de
# redondeo de un centimo (IVA al 21%, importes con tres decimales, el propio
# Excel que trae basura de coma flotante) sin abrir la puerta a pagar de mas.
# Diferencia de 2 centimos o mas -> R7 -> ESCALAR: "en la duda, ESCALAR" (ADR 6).
tolerancia_importe = 0.01
umbral_pago_maximo = 5000.00
score_minimo = 0.85

# Reglas inyectables (escenario sorpresa del sábado 18:00). Descomentar y
# recargar reglas.toml es suficiente; no hace falta recompilar.
#
# `prohibido_pagar_proveedor` son NIFs canónicos: da igual escribirlos con
# guion, espacios o minúsculas ("b-12345678" == "B12345678"), porque el tipo
# `Nif` los normaliza al cargar. A cambio, una entrada sin ningún carácter
# alfanumérico (por ejemplo "---") es un error de carga en vez de una regla que
# no bloquea nada en silencio.
# prohibido_pagar_proveedor = ["B12345678"]
# retener_iva = false
